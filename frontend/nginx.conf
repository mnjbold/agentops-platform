server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Security headers (universal)
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # ──────────────────────────────────────────────────────────────
  # PWA assets
  # ──────────────────────────────────────────────────────────────

  # Service worker: must NOT be cached by intermediaries, must be reachable
  # at the root scope. Service-Worker-Allowed: / lets it claim the whole origin.
  location = /sw.js {
    types { application/javascript js; }
    add_header Content-Type "application/javascript" always;
    add_header Service-Worker-Allowed "/" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # Web app manifest: correct MIME so the browser accepts it.
  location = /manifest.json {
    types { application/manifest+json json; }
    add_header Content-Type "application/manifest+json" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # Icons: long-lived immutable cache, explicit PNG MIME.
  location /icons/ {
    types { image/png png; }
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # Default static-asset cache for the rest of the bundle (CSS/JS/etc).
  # index.html is intentionally excluded — the SW forces a network fetch
  # on every page load so users always pick up new builds.
  location ~* \.(css|ico|svg|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
