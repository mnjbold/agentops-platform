<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07070b" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="agentops — the world's leading AI agentic telephony platform." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="agentops" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <title>agentops — AI Agentic Telephony</title>

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <script src="https://cdn.jsdelivr.net/npm/@telnyx/webrtc@2.8.2/lib/bundle.js" crossorigin="anonymous"
      onload="window.__telnyxBundleLoaded = true;"
      onerror="console.error('Telnyx bundle failed to load from CDN');"
    ></script>

    <!-- Pre-paint theme (no FOUC). Reads localStorage and sets data-theme BEFORE the stylesheet loads. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('agentops.theme') || 'dark';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <div style="padding: 24px; color: #fff; background: #07070b; font-family: sans-serif;">
        agentops requires JavaScript to run. Please enable it in your browser.
      </div>
    </noscript>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
